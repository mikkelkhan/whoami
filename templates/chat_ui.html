<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WHOAMI</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Inter', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e293b
                );

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }

        /* ============================ */
        /* CHAT CONTAINER */
        /* ============================ */

        .chat-container {

            width: 95%;

            max-width: 1000px;

            height: 94vh;

            background:
                rgba(255,255,255,0.06);

            backdrop-filter: blur(18px);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 28px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.45);
        }

        /* ============================ */
        /* HEADER */
        /* ============================ */

        .chat-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 24px;

            border-bottom:
                1px solid rgba(255,255,255,0.06);

            background:
                rgba(255,255,255,0.02);
        }

        .header-left {

            display: flex;

            align-items: center;

            gap: 14px;
        }

        .logo {

            width: 52px;

            height: 52px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

            font-weight: 700;

            font-size: 22px;
        }

        .header-text h1 {

            color: white;

            font-size: 22px;

            font-weight: 700;
        }

        .header-text p {

            color: #94a3b8;

            margin-top: 3px;

            font-size: 14px;
        }

        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #e2e8f0;

            font-size: 14px;
        }

        .status-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 12px #22c55e;
        }

        /* ============================ */
        /* CHAT BOX */
        /* ============================ */

        #chat-box {

            flex: 1;

            overflow-y: auto;

            padding: 24px;

            display: flex;

            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;

            gap: 14px;
        }

        

        /* ============================ */
        /* MESSAGE */
        /* ============================ */

        .message {

            display: flex;

            width: 100%;
            margin: 0;
        }

        .user {

            justify-content: flex-end;
        }

        .bot {

            justify-content: flex-start;
        }

        /* ============================ */
        /* BUBBLES */
        /* ============================ */

        .bubble {

            padding: 14px 18px;
            display: block;
            width: auto;

            border-radius: 18px;

            font-size: 15px;

            line-height: 1.7;

            word-break: break-word;

            white-space: pre-wrap;
            text-align: left;
            margin: 0;
            align-self: flex-start;


            
        }

        /* USER BUBBLE */

        .user .bubble {

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            max-width: 320px;

            
            

            border-bottom-right-radius: 6px;

            box-shadow:
                0 10px 24px rgba(37,99,235,0.35);
        }

        /* BOT BUBBLE */

        .bot .bubble {

            background:
                rgba(255,255,255,0.09);

            border:
                1px solid rgba(255,255,255,0.08);

            color: #f1f5f9;
            width: fit-content;

            max-width: 600px;
            padding: 14px 18px;
            

            border-bottom-left-radius: 6px;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================ */
        /* TYPING */
        /* ============================ */

        .typing {

            display: flex;

            gap: 6px;

            padding: 12px 16px;

            width: fit-content;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.08);
        }

        .dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: #cbd5e1;

            animation: bounce 1.2s infinite;
        }

        .dot:nth-child(2) {

            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {

            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%, 80%, 100% {

                transform: scale(0.8);

                opacity: 0.5;
            }

            40% {

                transform: scale(1.2);

                opacity: 1;
            }
        }

        /* ============================ */
        /* INPUT AREA */
        /* ============================ */

        .input-area {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 18px;

            border-top:
                1px solid rgba(255,255,255,0.06);

            background:
                rgba(255,255,255,0.03);
        }

        .input-wrapper {

            flex: 1;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 0 16px;
        }

        #user-input {

            width: 100%;

            background: transparent;

            border: none;

            outline: none;

            color: white;

            padding: 16px 0;

            font-size: 15px;
        }

        #user-input::placeholder {

            color: #94a3b8;
        }

        .send-btn {

            width: 56px;

            height: 56px;

            border: none;

            border-radius: 18px;

            cursor: pointer;

            color: white;

            font-size: 20px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 10px 24px rgba(37,99,235,0.35);

            transition: 0.2s;
        }

        .send-btn:hover {

            transform: scale(1.05);
        }

        /* ============================ */
        /* MOBILE */
        /* ============================ */

        @media (max-width: 768px) {

            body {

                overflow: hidden;
            }

            .chat-container {

                width: 100%;

                height: 100vh;

                border-radius: 0;
            }

            .chat-header {

                padding: 16px;
            }

            .header-text h1 {

                font-size: 18px;
            }

            .header-text p {

                font-size: 12px;
            }

            .logo {

                width: 44px;

                height: 44px;

                font-size: 18px;
            }

            #chat-box {

                padding: 16px;
            }

            .user .bubble {

                max-width: 78%;
            }

            .bot .bubble {

                max-width: 88%;
            }

            .bubble {

                font-size: 14px;

                padding: 12px 15px;
            }

            .input-area {

                padding: 12px;
            }

            .send-btn {

                width: 50px;

                height: 50px;
            }

            #user-input {

                font-size: 14px;
            }
        }

    </style>

</head>

<body>

    <div class="chat-container">

        <!-- HEADER -->

        <div class="chat-header">

            <div class="header-left">

                <div class="logo">
                    AI
                </div>

                <div class="header-text">

                    <h1>WHOAMI</h1>

                    <p>
                        Ask anything about Mikkel...
                    </p>

                </div>

            </div>

            <div class="status">

                <div class="status-dot"></div>

                Online

            </div>

        </div>

        <!-- CHAT -->

        <div id="chat-box"></div>

        <!-- INPUT -->

        <div class="input-area">

            <div class="input-wrapper">

                <input
                    type="text"
                    id="user-input"
                    placeholder="Type your message..."
                >

            </div>

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

    <script>

        async function sendMessage() {

            const input =
                document.getElementById("user-input")

            const message =
                input.value.trim()

            if (!message) return

            const chatBox =
                document.getElementById("chat-box")

            // USER MESSAGE

            chatBox.innerHTML += `
                <div class="message user">
                    <div class="bubble">
                        ${message}
                    </div>
                </div>
            `

            input.value = ""

            // TYPING

            const typingId =
                "typing-" + Date.now()

            chatBox.innerHTML += `
                <div
                    class="typing"
                    id="${typingId}"
                >
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `

            chatBox.scrollTop =
                chatBox.scrollHeight

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                })

                const data =
                    await response.json()

                document
                    .getElementById(typingId)
                    .remove()

                // BOT RESPONSE

                chatBox.innerHTML += `
                    <div class="message bot">
                        <div class="bubble">
                            ${data.answer}
                        </div>
                    </div>
                `

            }

            catch(error) {

                document
                    .getElementById(typingId)
                    .remove()

                chatBox.innerHTML += `
                    <div class="message bot">
                        <div class="bubble">
                            Something went wrong.
                        </div>
                    </div>
                `
            }

            chatBox.scrollTop =
                chatBox.scrollHeight
        }

        // ENTER KEY SUPPORT

        document
            .getElementById("user-input")
            .addEventListener(
                "keypress",
                function(event) {

                    if (event.key === "Enter") {

                        sendMessage()
                    }
                }
            )

    </script>

</body>

</html>
